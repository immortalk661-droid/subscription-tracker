{% extends "base.html" %}
{% block title %}{{ "Add Subscription" if mode == "add" else "Edit Subscription" }}{% endblock %}

{% block content %}
  <a href="{{ url_for('index') }}" class="back-link">&larr; Back to dashboard</a>
  <div class="form-wrap">
    <h1 class="form-title">{{ "Add Subscription" if mode == "add" else "Edit Subscription" }}</h1>
    <form method="POST" class="sub-form">
      <label class="field-label" for="service_name">Service Name</label>
      <input class="field-input" type="text" id="service_name" name="service_name"
             placeholder="e.g. Netflix" value="{{ sub.service_name if sub else '' }}" required>

      <label class="field-label" for="category">Category</label>
      <select class="field-input" id="category" name="category">
        {% for c in categories %}
          <option value="{{ c }}" {{ "selected" if sub and sub.category == c else "" }}>{{ c }}</option>
        {% endfor %}
      </select>

      <label class="field-label" for="cost">Cost</label>
      <input class="field-input" type="number" step="0.01" min="0" id="cost" name="cost"
             placeholder="e.g. 199.00" value="{{ sub.cost if sub else '' }}" required>

      <label class="field-label" for="billing_cycle">Billing Cycle</label>
      <select class="field-input" id="billing_cycle" name="billing_cycle">
        {% for b in billing_cycles %}
          <option value="{{ b }}" {{ "selected" if sub and sub.billing_cycle == b else "" }}>{{ b }}</option>
        {% endfor %}
      </select>

      <label class="field-label" for="next_renewal_date">Next Renewal Date</label>
      <input class="field-input" type="date" id="next_renewal_date" name="next_renewal_date"
             value="{{ sub.next_renewal_date if sub else '' }}" required>

      <label class="field-label" for="notes">Notes (optional)</label>
      <input class="field-input" type="text" id="notes" name="notes"
             placeholder="optional" value="{{ sub.notes if sub else '' }}">

      <button type="submit" class="btn btn-primary btn-full">
        {{ "Add Subscription" if mode == "add" else "Save Changes" }}
      </button>
    </form>
  </div>
{% endblock %}
